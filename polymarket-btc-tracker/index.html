<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket BTC Probability Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .stat-card.bullish {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .stat-card.bearish {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }

        .update-info {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #667eea;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #eb3349;
            background: #ffe6e6;
            border-radius: 10px;
            margin: 20px 0;
        }

        .market-list {
            margin-top: 30px;
        }

        .market-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .market-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .market-odds {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪙 Polymarket BTC Tracker</h1>
        <div class="subtitle">Live Probability Distribution of Bitcoin Price Predictions</div>

        <div id="loading" class="loading">Loading market data...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card bullish">
                    <div class="stat-label">Bullish Probability</div>
                    <div class="stat-value" id="bullish-prob">0%</div>
                </div>
                <div class="stat-card bearish">
                    <div class="stat-label">Bearish Probability</div>
                    <div class="stat-value" id="bearish-prob">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Market Sentiment</div>
                    <div class="stat-value" id="sentiment">Neutral</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Markets</div>
                    <div class="stat-value" id="market-count">0</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="distributionChart"></canvas>
            </div>

            <div class="update-info">
                Last updated: <span id="last-update">Never</span> |
                Auto-refresh every 30 seconds
            </div>

            <div class="market-list" id="market-list">
                <h2 style="margin-bottom: 15px;">Active BTC Markets</h2>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
